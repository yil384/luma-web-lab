  <!-- Tiny haute-couture ear bow, shaped to survive 32px rasterisation. -->
  <g transform="translate(92 32) rotate(16)">
    <path d="M0 2Q-11-12-19-11q-9 9 2 18L0 8Q17 17 22 6q-2-16-22-4Z"
      fill="url(#ribbon)" stroke="#a57086" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-8 7q-10 16-4 18l12-12q9 17 14 11L7 7"
      fill="url(#ribbon)" stroke="#a57086" stroke-width="1.5"/>
    <circle cx="1" cy="5" r="5.2" fill="url(#gold)" stroke="#fff2d7" stroke-width="1.3"/>
    <circle cx="1" cy="5" r="2.6" fill="#fff8f0"/>
  </g>
  <!-- A small soft neck ribbon and pearl center balance the cheeks. -->
  <path d="M52 111q-14-8-19-2-1 10 21 8 11 9 20 0 22 2 21-8-5-6-19 2"
    fill="url(#ribbon)" stroke="#ae7c91" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="64" cy="114" rx="6.5" ry="6" fill="url(#gold)" stroke="#fff4dc" stroke-width="1"/>
  <circle cx="64" cy="113" r="2.8" fill="#fff8f3"/>
</svg>