  <path d="M27 27q-1-5 3-3l16 12-18 18Z" fill="url(#ear)"/>
  <path d="M101 27q1-5-3-3L82 36l18 18Z" fill="url(#ear)"/>
  <path d="M37 55q-6 1-10 10 6-2 10 1m54-11q6 1 10 10-6-2-10 1"
    fill="#f0dcd1"/>
  <path d="M38 79q9-13 20-1-2 17-17 17-13-3-3-16Z" fill="#fff9f4"/>
  <path d="M70 78q11-12 20 1 10 13-3 16-15 0-17-17Z" fill="#fff9f4"/>
  <ellipse cx="49" cy="82" rx="9.6" ry="12.5" fill="url(#iris)"/>
  <ellipse cx="79" cy="82" rx="9.6" ry="12.5" fill="url(#iris)"/>
  <ellipse cx="49" cy="83" rx="5.1" ry="8.9" fill="#352f51"/>
  <ellipse cx="79" cy="83" rx="5.1" ry="8.9" fill="#352f51"/>
  <ellipse cx="45.8" cy="78" rx="3.2" ry="4.2" fill="#fffdf8"/>
  <ellipse cx="75.8" cy="78" rx="3.2" ry="4.2" fill="#fffdf8"/>
  <path d="M35 74q12-9 23 2m12 0q11-11 23-2" fill="none"
    stroke="#66515e" stroke-width="3" stroke-linecap="round"/>
  <path d="M39 74l-3-5m53 5 3-5" fill="none" stroke="#66515e" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="36" cy="95" rx="8.5" ry="3.5" fill="#f1b1b4" opacity="0.55"/>
  <ellipse cx="92" cy="95" rx="8.5" ry="3.5" fill="#f1b1b4" opacity="0.55"/>
  <path d="M60 93q4-3 8 0l-4 5Z" fill="#d78e98"/>
  <path d="M64 98q-5 5-9 2m9-2q5 5 9 2" fill="none"
