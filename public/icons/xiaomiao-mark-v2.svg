<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>小喵 · 透明背景猫咪徽章</title>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.60" stop-color="#fbf0e5"/>
      <stop offset="1" stop-color="#f0d9cf"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2b8be"/>
      <stop offset="1" stop-color="#ffe8db"/>
    </linearGradient>
    <radialGradient id="iris">
      <stop offset="0" stop-color="#c0b7ed"/>
      <stop offset="0.55" stop-color="#8475b9"/>
      <stop offset="1" stop-color="#4b4b81"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fee0e6"/>
      <stop offset="0.5" stop-color="#dea7b8"/>
      <stop offset="1" stop-color="#b77f96"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff3ce"/>
      <stop offset="0.55" stop-color="#dfb16a"/>
      <stop offset="1" stop-color="#ad764d"/>
    </linearGradient>
  </defs>
  <!-- Every exterior edge is alpha: browser tabs and home-screen shortcuts can
       choose their own backdrop. The ink-coloured keyline protects contrast. -->
  <path d="M22 57 19 22q0-10 9-5l22 15a61 61 0 0 1 28 0l22-15q9-5 9 5l-3 35q9 15 3 32-8 26-45 29-37-3-45-29-6-17 3-32Z"
