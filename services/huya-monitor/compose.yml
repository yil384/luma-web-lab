services:
  huya-monitor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
    environment:
      - DEMO_MODE=${DEMO_MODE:-0}
      - HUYA_CHAT_ENABLED=${HUYA_CHAT_ENABLED:-1}
      - POLL_SECONDS=${POLL_SECONDS:-45}
      - INGEST_TOKEN=${INGEST_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://tanchensiyi.com}
