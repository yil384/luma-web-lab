<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">Luma Web Lab runtime architecture</title>
<desc id="desc">SeasonalEntry resolves the URL and lazy-loads App for the root and Christmas routes or CastleRide for the letter route. App composes the Three.js scene, gallery, film and optional gesture mode. CastleRide composes HLS playback, sequence logic, effects and audio. Both load static resources. This is a simplified dependency view of the main source branch, not a deployment version assertion.</desc>
