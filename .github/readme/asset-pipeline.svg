<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">From source media to a static site</title>
<desc id="desc">Three preparation scripts generate photo, scene and hand-tracking assets. Source code, generated resources and existing HLS media feed TypeScript checks and Vite. The finalizer removes redundant source copies and creates real route index files. A matching dist snapshot can then be published to gh-pages. This pipeline does not generate or edit the films.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#60766f"/></marker></defs>
<rect width="1600" height="840" rx="20" fill="#f6f5ef"/>
<g font-family="Inter,Arial,Helvetica,sans-serif" fill="#1b3438">
 <text x="64" y="64" font-size="18" letter-spacing="3" fill="#61786d">LUMA WEB LAB / DELIVERY PIPELINE</text>
 <text x="64" y="122" font-size="46" font-weight="700" letter-spacing="-1">Prepare once. Serve static files.</text>
 <text x="64" y="162" font-size="23" fill="#60766f">Asset preparation and application compilation are separate steps.</text>
 <rect x="64" y="204" width="468" height="188" rx="12" fill="#fffef9" stroke="#ccd8cf"/>
 <text x="88" y="242" font-size="20" letter-spacing="2" fill="#3e7665">01 / PHOTOGRAPHY</text>
 <text x="88" y="282" font-size="26" font-weight="700">prepare-photos.mjs</text>
 <text x="88" y="321" font-size="22" fill="#536b60">Source images + manifest</text>
 <text x="88" y="355" font-size="22" fill="#536b60">→ WebP variants, atlas and manifest</text>
 <rect x="566" y="204" width="468" height="188" rx="12" fill="#fffef9" stroke="#ccd8cf"/>
 <text x="590" y="242" font-size="20" letter-spacing="2" fill="#3e7665">02 / SCENE</text>
 <text x="590" y="282" font-size="26" font-weight="700">prepare-scene.mjs</text>
 <text x="590" y="321" font-size="22" fill="#536b60">Scene configuration + source assets</text>
 <text x="590" y="355" font-size="22" fill="#536b60">→ Runtime resources + scene manifest</text>
 <rect x="1068" y="204" width="468" height="188" rx="12" fill="#fffef9" stroke="#ccd8cf"/>
 <text x="1092" y="242" font-size="20" letter-spacing="2" fill="#3e7665">03 / OPTIONAL INPUT</text>
 <text x="1092" y="282" font-size="25" font-weight="700">prepare-hand-tracking.mjs</text>
 <text x="1092" y="321" font-size="22" fill="#536b60">Gesture model + SDK assets</text>
 <text x="1092" y="355" font-size="22" fill="#536b60">→ Local runtime files + worker</text>
 <path d="M298 392v30h1004v-30" fill="none" stroke="#60766f" stroke-width="2"/><path d="M800 392v62" fill="none" stroke="#60766f" stroke-width="2" marker-end="url(#a)"/>
 <rect x="64" y="466" width="1472" height="72" rx="10" fill="#e5ebe2"/>
 <text x="88" y="510" font-size="24" font-weight="700">Build inputs</text>
 <text x="264" y="510" font-size="23" fill="#536b60">src/ + generated resources + existing static media, including HLS</text>
 <path d="M240 538v47" fill="none" stroke="#60766f" stroke-width="2" marker-end="url(#a)"/>
 <rect x="64" y="598" width="344" height="126" rx="12" fill="#173d42"/>
 <text x="88" y="640" font-size="28" font-weight="700" fill="#fffdf2">TypeScript + Vite</text>
 <text x="88" y="679" font-size="22" fill="#c4dbd0">Type check + bundle assets</text>
 <path d="M408 660h66" stroke="#60766f" stroke-width="2" marker-end="url(#a)"/>
 <rect x="490" y="598" width="470" height="126" rx="12" fill="#fffef9" stroke="#ccd8cf"/>
 <text x="514" y="640" font-size="28" font-weight="700">finalize-build.mjs</text>
 <text x="514" y="679" font-size="22" fill="#536b60">Trim source copies; write route entries</text>
 <path d="M960 660h66" stroke="#60766f" stroke-width="2" marker-end="url(#a)"/>
 <rect x="1042" y="598" width="494" height="126" rx="12" fill="#eaf1e9" stroke="#94b69e"/>
 <text x="1066" y="640" font-size="28" font-weight="700">dist/ → static hosting</text>
 <text x="1066" y="679" font-size="22" fill="#536b60">/ · /christmas/ · /letter/ + assets</text>
 <text x="64" y="775" font-size="21" fill="#60766f">Pages: publish a matching prebuilt snapshot to gh-pages with .nojekyll and the correct project base path.</text>
 <text x="64" y="808" font-size="20" fill="#60766f">Existing video is an input, not generated by this build. Source and published snapshots must be checked separately.</text>
</g>
</svg>
