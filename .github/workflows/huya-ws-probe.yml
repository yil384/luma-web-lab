name: Huya 156324 WebSocket protocol probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/huya-monitor/app/tars.py'
      - 'scripts/huya_ws_probe.py'
      - '.github/workflows/huya-ws-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install socket library
        run: python -m pip install 'websockets>=13,<16'
      - name: 45-second public protocol probe (no message content logged)
        run: python scripts/huya_ws_probe.py --seconds 45 --out "$RUNNER_TEMP/huya-probe-result.json"
      - name: Upload counters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huya-protocol-counters
          path: ${{ runner.temp }}/huya-probe-result.json
          if-no-files-found: ignore
          retention-days: 3
