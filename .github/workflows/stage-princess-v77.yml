name: Stage and verify V77 skeletal character

on:
  push:
    branches: [feat/princess-v76-kitten-p0-p1]
    paths:
      - '.github/workflows/stage-princess-v77.yml'
      - 'src/scene/princess-kitten/**'
      - 'tools/princess-rig/**'
      - 'scripts/build-princess-v77-release.mjs'
      - 'scripts/qa-princess-v77.cjs'
      - 'tests/princess-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-princess-v77
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the same verified skeletal GLB from V76
        working-directory: source
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python tools/princess-rig/build_v77.py
          sha256sum --check tools/princess-rig/verified-v77.sha256
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/princess-kitten*.test.mjs tests/princess-rig*.test.mjs
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Verify exact entry integration and preserved assets
        working-directory: source
        env:
          LUMA_PAGES_BASELINE: ${{ github.workspace }}/pages
        run: |
          node --test tests/princess-v77-release.test.mjs
          node scripts/build-princess-v77-release.mjs "$LUMA_PAGES_BASELINE"
          node --input-type=module --check < "$LUMA_PAGES_BASELINE/assets/TreeScene-PrincessRig-V77.js"
      - name: Install isolated browser test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/v77-browser"
          npm install --prefix "$RUNNER_TEMP/v77-browser" --no-audit --no-fund playwright@1.55.1
          "$RUNNER_TEMP/v77-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the staged scene in real desktop and mobile Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/v77-browser/node_modules
          V77_BASE_URL: http://127.0.0.1:4173/
          V77_QA_OUTPUT: ${{ github.workspace }}/v77-browser-evidence
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory pages > "$RUNNER_TEMP/v77-server.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node source/scripts/qa-princess-v77.cjs
      - name: Record verified candidate in an isolated branch
        working-directory: pages
        env:
          CANDIDATE_BRANCH: release/princess-v77-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html christmas/index.html assets/TreeScene-PrincessRig-V77.js assets/princess-kitten-v77 princess/luma-princess-rigged-v77.glb princess/luma-princess-rigged-v77.glb.gz v77-release-status.json
          git commit -m 'Stage verified V77 arm and eyelid rig with scene interactions'
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git rev-parse HEAD > ../v77-browser-evidence/candidate-commit.txt
          printf '%s\n' "$CANDIDATE_BRANCH" > ../v77-browser-evidence/candidate-branch.txt
          printf '%s\n' '${{ github.sha }}' > ../v77-browser-evidence/source-commit.txt
      - name: Save browser and rig verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V77-skeletal-scene-evidence
          path: |
            v77-browser-evidence/
            source/docs/princess-kitten-p0-p1/evidence/reports/princess_v77_rig.json
          retention-days: 14
          if-no-files-found: error
