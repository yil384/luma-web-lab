name: Update Huya public room snapshot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/huya_snapshot.py'
      - 'scripts/merge_huya_history.py'
      - 'services/huya-monitor/app/scraper.py'
      - '.github/workflows/live-room-snapshot.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huya-room-public-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public page parser and optional browser
        run: |
          python -m pip install 'httpx>=0.27,<1' 'beautifulsoup4>=4.12,<5' 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Capture verified public page
        run: python scripts/huya_snapshot.py --output "$RUNNER_TEMP/room.json" --browser-fallback
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          persist-credentials: true
      - name: Publish room JSON and bounded history only
        working-directory: published
        env:
          SOURCE_JSON: ${{ runner.temp }}/room.json
        run: |
          set -euo pipefail
          mkdir -p live/data
          python ../scripts/merge_huya_history.py --history live/data/history.json --snapshot "$SOURCE_JSON"
          cp "$SOURCE_JSON" live/data/room.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/data/room.json live/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Huya 156324 public room snapshot'
            git push origin HEAD:gh-pages
          fi
