name: Update Huya public room snapshot

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huya-room-public-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public page parser
        run: python -m pip install 'httpx>=0.27,<1' 'beautifulsoup4>=4.12,<5'
      - name: Capture public page (fail closed)
        run: python scripts/huya_snapshot.py --output "$RUNNER_TEMP/room.json"
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          persist-credentials: true
      - name: Publish only room JSON to GitHub Pages
        working-directory: published
        env:
          SOURCE_JSON: ${{ runner.temp }}/room.json
        run: |
          set -euo pipefail
          mkdir -p live/data
          cp "$SOURCE_JSON" live/data/room.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/data/room.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'data: refresh Huya 156324 public room snapshot'
            git push origin HEAD:gh-pages
          fi
