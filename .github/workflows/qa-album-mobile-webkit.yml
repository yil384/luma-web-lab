name: QA album mobile paint handoff (Chromium + WebKit)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-album-mobile-webkit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-album:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and WebKit mobile browser engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/album-webkit"
          cd "$RUNNER_TEMP/album-webkit"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise real browser painting across repeated book turns
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/album-webkit"
          cat > qa.cjs <<'NODE'
          const { chromium, webkit, request } = require('playwright');
          const { writeFileSync, mkdirSync } = require('node:fs');
          const base='https://tanchensiyi.com';
          const out=process.env.GITHUB_WORKSPACE+'/album-mobile-qa';
          mkdirSync(out,{recursive:true});
          const checks=[],traces=[];
          function check(name,good,details){
            const item={name,pass:!!good,details};
            checks.push(item);
            console.log((good?'PASS ':'FAIL ')+name+' '+JSON.stringify(details??null));
          }
          const snap=page=>page.evaluate(()=>{
            const book=document.querySelector('.memory-album-book');
            const root='.memory-album-spread > .memory-album-sheet';
            const l=document.querySelector(root+'--left .memory-album-print img');
            const r=document.querySelector(root+'--right .memory-album-print img');
            const rev=document.querySelector('.memory-album-reveal');
            const revImg=rev?.querySelector('.memory-album-print img');
            return {phase:book?.dataset.bookPhase,
              left:{src:l?.getAttribute('src'),width:l?.naturalWidth,complete:l?.complete},
              right:{src:r?.getAttribute('src'),width:r?.naturalWidth,complete:r?.complete},
              reveal:rev?{opacity:getComputedStyle(rev).opacity,width:revImg?.naturalWidth,
                complete:revImg?.complete,visible:getComputedStyle(rev).visibility}:null,
              leaf:!!document.querySelector('.memory-album-leaf')};
          });
          async function run(name,engine,settings,extraArgs=[]){
            const browser=await engine.launch({headless:true,args:extraArgs});
            const context=await browser.newContext({
              viewport:{width:390,height:844},deviceScaleFactor:2,
              isMobile:true,hasTouch:true,serviceWorkers:'block',
              reducedMotion:'no-preference',...settings
            });
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            try {
              const response=await page.goto(base+'/album-preview/?paintqa=8',{waitUntil:'domcontentloaded',timeout:90000});
              await page.locator('.memory-album-book').waitFor({timeout:80000});
              await page.waitForFunction(()=>{
                const imgs=[...document.querySelectorAll('.memory-album-spread > .memory-album-sheet img')];
                return imgs.length===2&&imgs.every(img=>img.complete&&img.naturalWidth>=800);
              },null,{timeout:70000,polling:100});
              const first=await snap(page);
              check(name+' preview loads full HD',response.status()===200&&
                first.left.width>=800&&first.right.width>=800,{status:response.status(),first});
              const turns=[];
              for(let i=0;i<6;i++){
                const direction=i%2===0?'next':'previous';
                const before=await snap(page);
                await page.locator('.memory-album-turn--'+direction).click({force:true,timeout:30000});
                await page.waitForFunction(()=>['turning','settling'].includes(
                  document.querySelector('.memory-album-book')?.dataset.bookPhase),null,{timeout:45000});
                const history=await page.evaluate(async()=>{
                  const data=[],start=performance.now();
                  return await new Promise(resolve=>{
                    let sawSettling=false;
                    function frame(){
                      const phase=document.querySelector('.memory-album-book')?.dataset.bookPhase;
                      const sheetL=document.querySelector('.memory-album-spread > .memory-album-sheet--left .memory-album-print img');
                      const sheetR=document.querySelector('.memory-album-spread > .memory-album-sheet--right .memory-album-print img');
                      const overlay=document.querySelector('.memory-album-reveal');
                      const image=overlay?.querySelector('.memory-album-print img');
                      const item={phase,elapsed:Math.round(performance.now()-start),
                        l:sheetL?.naturalWidth||0,r:sheetR?.naturalWidth||0,
                        overlay:!!overlay,overlayWidth:image?.naturalWidth||0,
                        overlayOpacity:overlay?Number(getComputedStyle(overlay).opacity):null,
                        overlayVisibility:overlay?getComputedStyle(overlay).visibility:null};
                      if(phase==='settling')sawSettling=true;
                      data.push(item);
                      if((sawSettling&&phase==='ready')||performance.now()-start>9000){
                        resolve(data);return;
                      }
                      requestAnimationFrame(frame);
                    }
                    frame();
                  });
                });
                const after=await snap(page);
                const settled=history.filter(x=>x.phase==='settling');
                const badSettled=settled.filter(x=>!x.overlay||x.overlayWidth<800||
                  x.overlayOpacity<.99||x.overlayVisibility==='hidden'||
                  x.l<800||x.r<800);
                const good=history.at(-1)?.phase==='ready'&&
                  settled.length>=1&&badSettled.length===0&&
                  after.left.width>=800&&after.right.width>=800&&
                  after.left.src!==before.left.src;
                turns.push({direction,good,samples:history.length,settlingFrames:settled.length,
                  badSettled:badSettled.slice(0,4),before,after});
                check(name+' '+direction+' turn #'+(i+1)+' never uncovers blank left page',good,
                  turns.at(-1));
              }
              traces.push({name,turns,errors});
              check(name+' no JS errors',errors.length===0,errors.slice(0,8));
            } finally {
              await context.close();
              await browser.close();
            }
          }
          (async()=>{
            const req=await request.newContext();
            const htmlResponse=await req.get(base+'/album-preview/',{timeout:50000});
            const html=await htmlResponse.text();
            check('preview explicitly stages mobile v8',htmlResponse.ok()&&
              html.includes('PhotoGallery-AlbumMobileStable-20261117-v8.js')&&
              html.includes('memory-album-mobile-stable-v8.css'),{status:htmlResponse.status()});
            for(const asset of ['PhotoGallery-AlbumMobileStable-20261117-v8.js','memory-album-mobile-stable-v8.css']){
              const r=await req.get(base+'/assets/'+asset,{timeout:50000});
              check(asset+' is published',r.ok(),{status:r.status(),bytes:(await r.body()).length});
            }
            await req.dispose();
            await run('chromium-mobile',chromium,{},
              ['--enable-webgl','--use-gl=angle','--use-angle=swiftshader',
                '--enable-unsafe-swiftshader','--disable-dev-shm-usage']);
            await run('webkit-mobile',webkit,{});
            writeFileSync(out+'/results.json',JSON.stringify({checks,traces,timestamp:new Date().toISOString()},null,2));
            if(checks.some(x=>!x.pass))process.exitCode=1;
          })().then(()=>process.exit(process.exitCode||0))
            .catch(e=>{console.error('MOBILE_ALBUM_QA_FATAL',e);process.exit(1)});
          NODE
          timeout 480 node qa.cjs
      - name: Save paint-handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-mobile-chromium-webkit-paint-evidence
          path: album-mobile-qa/
          retention-days: 7
          if-no-files-found: warn
