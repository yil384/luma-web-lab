name: QA album hover-stable HD prints and swipes (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-album-swipe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/album-qa"
          cd "$RUNNER_TEMP/album-qa"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.55.1
          npx playwright install chromium
      - name: Smoke test album preview and gestures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/album-qa"
          cat > qa.cjs <<'NODE'
          const {chromium,request}=require('playwright');
          const {writeFileSync,mkdirSync}=require('node:fs');
          const base='https://tanchensiyi.com',out=process.env.GITHUB_WORKSPACE+'/album-qa';
          mkdirSync(out,{recursive:true});
          const checks=[],samples=[];
          function check(name,good,value){checks.push({name,pass:!!good,value});console.log((good?'PASS ':'FAIL ')+name+' '+JSON.stringify(value??null))}
          const left='.memory-album-spread > .memory-album-sheet--left .memory-album-print img';
          const read=page=>page.evaluate(sel=>{
            const el=document.querySelector(sel),reveal=document.querySelector('.memory-album-reveal'),book=document.querySelector('.memory-album-book');
            return {src:el?.getAttribute('src')||null,complete:!!el?.complete,naturalWidth:el?.naturalWidth||0,
             revealOpacity:reveal?getComputedStyle(reveal).opacity:null,
             revealVisibility:reveal?getComputedStyle(reveal).visibility:null,
             leaf:!!document.querySelector('.memory-album-leaf'),
             zoomDialogs:document.querySelectorAll('dialog.memory-album-zoom-dialog').length,
             bookVisible:!!book&&book.getBoundingClientRect().width>100,
             bookWidth:book?.getBoundingClientRect().width};
          },left);
          const layout=page=>page.evaluate(()=>{
            return [...document.querySelectorAll('.memory-album-spread > .memory-album-sheet')].map(el=>{
              const mount=el.querySelector('.memory-album-photo-mount');
              const img=mount?.querySelector('img');
              if(!mount||!img)return {ok:false,reason:'missing mount or image'};
              const a=el.getBoundingClientRect(),b=mount.getBoundingClientRect();
              const dx=Math.round((b.left+b.width/2)-(a.left+a.width/2));
              const dy=Math.round((b.top+b.height/2)-(a.top+a.height/2));
              const inside=b.left>=a.left-10&&b.right<=a.right+10&&b.top>=a.top-10&&b.bottom<=a.bottom+10;
              return {ok:Math.abs(dx)<25&&Math.abs(dy)<25&&inside&&img.complete&&img.naturalWidth>=800&&
                !img.getAttribute('src')?.includes('-thumb.'),dx,dy,inside,
                naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,
                src:img.getAttribute('src'),pageWidth:Math.round(a.width),pageHeight:Math.round(a.height),
                printWidth:Math.round(b.width),printHeight:Math.round(b.height)};
            });
          });
          async function checkStableHover(page, side, suffix=''){
            // The book's intro uses a 540ms scale/translate animation. Its
            // bounding box changes while that is running independently of
            // hovering; wait for the opening animation before comparing boxes.
            await page.locator('.memory-album-book').evaluate(async el=>{
              await Promise.all(el.getAnimations({subtree:false})
                .filter(a=>a.playState==='running').map(a=>a.finished.catch(()=>{})));
            });
            await page.waitForTimeout(140);
            // Move away first so the before box is genuinely non-hovered.
            await page.mouse.move(4,4);
            const print=page.locator('.memory-album-spread > .memory-album-sheet--'+side+' button.memory-album-photo-mount');
            const before=await print.boundingBox();
            await print.hover({force:true,timeout:10000});
            await page.waitForTimeout(100);
            const after=await print.boundingBox();
            const style=await print.evaluate(el=>({hover:el.matches(':hover'),focusVisible:el.matches(':focus-visible'),
              transform:getComputedStyle(el).transform,transition:getComputedStyle(el).transition}));
            const frames=await layout(page);
            const stable=!!before&&!!after&&
              Math.abs(before.x-after.x)<1&&Math.abs(before.y-after.y)<1&&
              Math.abs(before.width-after.width)<1&&Math.abs(before.height-after.height)<1;
            check('photo does not jump on '+side+' hover'+suffix,
              stable&&style.hover&&style.transform!=='none'&&frames.length===2&&frames.every(x=>x.ok),
              {before,after,style,frames});
          }
          async function checkStableFocus(page,side){
            await page.mouse.move(4,4);
            const print=page.locator('.memory-album-spread > .memory-album-sheet--'+side+' button.memory-album-photo-mount');
            const before=await print.boundingBox();
            // Force keyboard modality before focusing to exercise :focus-visible.
            await page.keyboard.press('Tab');
            await print.focus();
            await page.waitForTimeout(80);
            const after=await print.boundingBox();
            const state=await print.evaluate(el=>({
              focus:document.activeElement===el,
              focusVisible:el.matches(':focus-visible'),
              transform:getComputedStyle(el).transform
            }));
            const unchanged=!!before&&!!after&&Math.abs(before.x-after.x)<1&&
              Math.abs(before.y-after.y)<1&&Math.abs(before.width-after.width)<1&&
              Math.abs(before.height-after.height)<1;
            check('keyboard focus does not displace '+side+' photo',unchanged&&state.focus&&
              state.focusVisible&&state.transform!=='none',{before,after,state});
            await print.evaluate(el=>el.blur());
          }
          async function open(page){
            let res;
            for(let attempt=1;attempt<=4;attempt++){
              res=await page.goto(base+'/album-preview/',{waitUntil:'domcontentloaded',timeout:75000});
              if(res.status()===200)break;
              await page.waitForTimeout(1000*attempt);
            }
            await page.locator('.memory-album-book').waitFor({timeout:70000});
            await page.locator(left).waitFor({timeout:25000});
            // A DOM-mounted <img> is not necessarily decoded (especially on
            // cold mobile CI). Wait for BOTH actual original-resolution prints.
            await page.waitForFunction(()=>{
              const imgs=[...document.querySelectorAll('.memory-album-spread > .memory-album-sheet img')];
              return imgs.length===2&&imgs.every(img=>img.complete&&img.naturalWidth>=800);
            },null,{timeout:60000,polling:100});
            return res;
          }
          async function waitCommitted(page,previousSrc,expectDifferent=true){
            await page.waitForFunction(({selector,previousSrc,expectDifferent})=>{
              const img=document.querySelector(selector);
              const src=img?.getAttribute('src')||'';
              return !!img&&!document.querySelector('.memory-album-leaf')&&
                img.complete&&img.naturalWidth>0&&
                (expectDifferent?src!==previousSrc:src===previousSrc);
            },{selector:left,previousSrc,expectDifferent},{timeout:25000,polling:100});
          }
          async function turnViaButton(page,label,previousSrc){
            await page.locator(label).click({timeout:20000,force:true});
            await waitCommitted(page,previousSrc);
          }
          async function main(){
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
            const pc=await browser.newContext({viewport:{width:1240,height:820},serviceWorkers:'block'});
            const page=await pc.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const resp=await open(page);
            check('desktop preview HTTP 200',resp.status()===200,resp.status());
            // The book has an introductory 540 ms CSS animation. Allow it to
            // finish before measuring the first page turn; these are separate
            // animations and overlapping them creates a false timing failure.
            await page.waitForTimeout(680);
            const original=await read(page);
            const initialLayout=await layout(page);
            check('both desktop HD photos centered and fully inside pages',initialLayout.length===2&&initialLayout.every(x=>x.ok),initialLayout);
            check('book image ready and uses original HD source',original.complete&&original.naturalWidth>=800&&original.src.includes('/generated/photos/')&&!original.src.includes('-thumb.'),original);
            await checkStableHover(page,'left');
            await checkStableHover(page,'right');
            await checkStableFocus(page,'left');
            await checkStableFocus(page,'right');
            const nextBtn='.memory-album-turn--next';
            await page.locator(nextBtn).click({force:true});
            await page.waitForTimeout(380);
            const middle=await read(page);
            check('left print remains unchanged halfway',middle.src===original.src&&middle.leaf,{original,middle});
            check('left reveal is NOT flashed halfway',middle.revealOpacity==='0',middle);
            await waitCommitted(page,original.src);
            const next=await read(page);
            const nextLayout=await layout(page);
            check('next spread stays centered with original photos',nextLayout.length===2&&nextLayout.every(x=>x.ok),nextLayout);
            check('flip commits next left photo',next.src!==original.src&&next.complete&&next.naturalWidth>0&&!next.leaf,{original,next});
            await turnViaButton(page,'.memory-album-turn--previous',next.src);
            const back=await read(page);
            const backLayout=await layout(page);
            check('previous spread stays centered',backLayout.length===2&&backLayout.every(x=>x.ok),backLayout);
            await checkStableHover(page,'left',' after backward flip');
            await checkStableHover(page,'right',' after backward flip');
            check('backward flip returns original ready left',back.src===original.src&&back.complete&&back.naturalWidth>0,back);
            // Desktop click-and-drag horizontally should turn pages as well.
            const rect=await page.locator('.memory-album-book').boundingBox();
            let sx=rect.x+rect.width*.70,sy=rect.y+rect.height*.46;
            await page.mouse.move(sx,sy);await page.mouse.down();
            for(let j=1;j<=7;j++)await page.mouse.move(sx-j*19,sy,{steps:2});
            await page.mouse.up();await waitCommitted(page,back.src);
            const dragged=await read(page);
            const dragLayout=await layout(page);
            check('dragged spread stays centered',dragLayout.length===2&&dragLayout.every(x=>x.ok),dragLayout);
            check('desktop horizontal drag turns without arrows',dragged.src!==back.src&&dragged.zoomDialogs===0,dragged);
            await page.locator('.memory-album-spread .memory-album-sheet--left button.memory-album-photo-mount').click({force:true,timeout:20000});
            await page.waitForTimeout(200);
            const hd=await page.evaluate(()=>({dialog:!!document.querySelector('dialog.memory-album-zoom-dialog[open]'),src:document.querySelector('dialog.memory-album-zoom-dialog img.gallery-image')?.getAttribute('src')||''}));
            check('tapping print opens unchanged HD photo',hd.dialog&&hd.src.includes('/generated/photos/')&&!hd.src.includes('-thumb.'),hd);
            check('desktop has no JS errors',errors.length===0,errors.slice(0,6));
            samples.push({mode:'desktop',original,middle,next,back,dragged,hd,errors});
            await pc.close();
            const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2,serviceWorkers:'block'});
            const mp=await mobile.newPage(),mobileErrors=[];
            mp.on('pageerror',e=>mobileErrors.push(e.message));
            const mr=await open(mp);
            check('mobile preview HTTP 200',mr.status()===200,mr.status());
            const first=await read(mp),bounds=await mp.locator('.memory-album-book').boundingBox();
            const firstMobileLayout=await layout(mp);
            check('mobile original photos centered',firstMobileLayout.length===2&&firstMobileLayout.every(x=>x.ok),firstMobileLayout);
            check('mobile book image ready',first.complete&&first.naturalWidth>0,first);
            async function swipe(from,to){
              const cdp=await mobile.newCDPSession(mp),y=bounds.y+bounds.height*.52;
              await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:from,y,id:1}]});
              for(let i=1;i<=8;i++){
                await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:from+(to-from)*i/8,y,id:1}]});
                await mp.waitForTimeout(24);
              }
              await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            }
            await swipe(bounds.x+bounds.width*.78,bounds.x+bounds.width*.20);
            await waitCommitted(mp,first.src);
            const leftSwipe=await read(mp);
            check('mobile left swipe advances book',leftSwipe.src!==first.src&&leftSwipe.complete&&leftSwipe.naturalWidth>0&&leftSwipe.zoomDialogs===0,{first,leftSwipe});
            await swipe(bounds.x+bounds.width*.20,bounds.x+bounds.width*.78);
            await waitCommitted(mp,leftSwipe.src);
            const rightSwipe=await read(mp);
            const lastMobileLayout=await layout(mp);
            check('mobile swipe keeps both photos centered',lastMobileLayout.length===2&&lastMobileLayout.every(x=>x.ok),lastMobileLayout);
            check('mobile right swipe returns prior spread',rightSwipe.src===first.src&&rightSwipe.complete&&rightSwipe.naturalWidth>0&&rightSwipe.zoomDialogs===0,{first,rightSwipe});
            check('mobile has no JS errors',mobileErrors.length===0,mobileErrors.slice(0,6));
            samples.push({mode:'mobile',first,leftSwipe,rightSwipe,mobileErrors});
            await mobile.close();await browser.close();
            const req=await request.newContext();
            for(const route of ['/','/christmas/','/letter/','/generated/photo-manifest.json']){
              const r=await req.get(base+route,{timeout:60000});
              check('preserved '+route,r.status()===200,r.status());
            }
            // Preview stages the hover-specificity fix; production still uses v6 until
            // the preview's browser checks pass. Both use the unchanged HD JS.
            for(const route of ['/','/christmas/','/album-preview/']){
              const r=await req.get(base+route,{timeout:60000}),html=await r.text();
              const expectedCss=route==='/album-preview/'?'memory-album-hd-v7.css':'memory-album-hd-v6.css';
              check('staged HD hover CSS '+route,r.status()===200&&
                html.includes('/assets/PhotoGallery-AlbumHD-20261117-v6.js')&&
                html.includes('/assets/'+expectedCss),{status:r.status(),expectedCss});
            }
            for(const name of ['PhotoGallery-AlbumHD-20261117-v6.js','memory-album-hd-v7.css']){
              const r=await req.get(base+'/assets/'+name,{timeout:60000});
              check('HD hover asset served '+name,r.status()===200,{status:r.status(),length:(await r.body()).length});
            }
            await req.dispose();
            writeFileSync(out+'/results.json',JSON.stringify({checks,samples,timestamp:new Date().toISOString()},null,2));
            if(checks.some(x=>!x.pass))process.exitCode=1;
          }
          main().then(()=>process.exit(process.exitCode||0)).catch(e=>{console.error('ALBUM_QA_FATAL',e);process.exit(1)});
          NODE
          timeout 240 node qa.cjs
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-swipe-flicker-evidence
          path: album-qa/
          retention-days: 7
          if-no-files-found: warn
