name: Validate V73 production in real Chromium

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-v73-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse emitted V73 JavaScript and verify binary
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/index-CJX_PAH8.js assets/App-GeminiV73.js assets/TreeScene-GeminiV73.js assets/princess-v72-loader.js; do
            node --input-type=module --check < "$file"
            echo "Valid ESM: $file"
          done
          echo '82850162e6363cf41fdcf660d7cf317d276bc99d4c6872824f51f939af5dc297  princess/luma-princess-hug-v73.glb' | sha256sum -c -
          test -s preview-hug/index.html
      - name: Set up Playwright in temp workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-check"
          cd "$RUNNER_TEMP/browser-check"
          npm init -y >/dev/null
          npm install --no-save playwright@^1.55.0
          npx playwright install --with-deps chromium
      - name: Browser render and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/browser-check"
          cat > smoke.cjs <<'NODE'
          const { chromium }=require('playwright');
          const {writeFileSync,mkdirSync}=require('fs');
          const dir=process.env.GITHUB_WORKSPACE+'/v73-preview-qa';
          mkdirSync(dir,{recursive:true});
          const report={url:'https://tanchensiyi.com/',checks:[],browserErrors:[],glbRequests:[]};
          const run=async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
            for(const mode of [{name:'desktop-home',width:1440,height:900,url:'https://tanchensiyi.com/'},{name:'mobile-christmas',width:390,height:844,url:'https://tanchensiyi.com/christmas/'}]) {
              const ctx=await browser.newContext({viewport:{width:mode.width,height:mode.height},deviceScaleFactor:mode.name==='mobile'?2:1,isMobile:mode.name==='mobile',hasTouch:mode.name==='mobile',serviceWorkers:'block'});
              const page=await ctx.newPage();
              page.on('pageerror',error=>report.browserErrors.push(mode.name+': '+error.message));
              page.on('console',message=>{if(message.type()==='error')report.browserErrors.push(mode.name+': '+message.text())});
              page.on('response',response=>{if(response.url().endsWith('luma-princess-hug-v73.glb')||response.url().includes('chonky-cat-trio'))report.glbRequests.push({mode:mode.name,url:response.url(),status:response.status()})});
              try {
                const res=await page.goto(mode.url,{waitUntil:'domcontentloaded',timeout:45000});
                try{await page.waitForFunction(()=>['ready','ready-no-kitten','failed'].includes(document.documentElement.dataset.princessV73),{timeout:35000})}catch{}
                await page.waitForTimeout(4000);
                const info=await page.evaluate(()=>({
                  title:document.title,
                  princess:document.documentElement.dataset.princessV73||'unset',
                  kitten:document.documentElement.dataset.princessHeldKitten||'unset',
                  canvasCount:document.querySelectorAll('canvas').length,
                  hasCanvasFallback:document.body.innerText.includes('当前浏览器无法显示 3D 圣诞树'),
                  debug:document.getElementById('v73-preview-status')?.textContent||''
                }));
                report.checks.push({mode:mode.name,http:res?.status(),...info});
                // Capture the GPU frame through CDP directly. Playwright's
                // screenshot stabilization may time out on continuously animated WebGL.
                try {
                  const cdp=await ctx.newCDPSession(page);
                  const cap=await Promise.race([
                    cdp.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false,fromSurface:true}),
                    new Promise((_,reject)=>setTimeout(()=>reject(new Error('CDP screenshot timeout')),18000))
                  ]);
                  writeFileSync(dir+'/'+mode.name+'.png',Buffer.from(cap.data,'base64'));
                  await cdp.detach();
                } catch(err) {
                  report.browserErrors.push(mode.name+' optional screenshot: '+err.message);
                }
              }catch(e){report.checks.push({mode:mode.name,error:e.message})}
              await ctx.close();
            }
            await browser.close();
          };
          run().catch(e=>report.browserErrors.push('fatal: '+e.message)).finally(()=>{
            writeFileSync(dir+'/report.json',JSON.stringify(report,null,2));
            console.log('V73 QA RESULT '+JSON.stringify(report));
            // Distinguish an unsupported CI GPU from actual asset failure.
            const failed=report.checks.some(x=>x.princess==='failed'||x.kitten==='failed'||x.http!==200);
            if(failed)process.exitCode=1;
          });
          NODE
          node smoke.cjs
      - name: Upload screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V73-WebGL-preview-evidence
          path: v73-preview-qa/
          retention-days: 5
          if-no-files-found: warn
