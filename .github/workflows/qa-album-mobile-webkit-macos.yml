name: QA mobile WebKit explicit photo front/back face gating v10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-album-mobile-webkit-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-album:
    runs-on: macos-15
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install WebKit mobile browser engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/album-webkit"
          cd "$RUNNER_TEMP/album-webkit"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.55.1
          npx playwright install webkit
      - name: Exercise real browser painting across repeated book turns
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/album-webkit"
          cat > qa.cjs <<'NODE'
          const { chromium, webkit, request } = require('playwright');
          const { writeFileSync, mkdirSync } = require('node:fs');
          const base='https://tanchensiyi.com';
          const out=process.env.GITHUB_WORKSPACE+'/album-mobile-qa';
          mkdirSync(out,{recursive:true});
          const checks=[],traces=[];
          function check(name,good,details){
            const item={name,pass:!!good,details};
            checks.push(item);
            console.log((good?'PASS ':'FAIL ')+name+' '+JSON.stringify(details??null));
          }
          const snap=page=>page.evaluate(()=>{
            const book=document.querySelector('.memory-album-book');
            const root='.memory-album-spread > .memory-album-sheet';
            const l=document.querySelector(root+'--left .memory-album-print img');
            const r=document.querySelector(root+'--right .memory-album-print img');
            const rev=document.querySelector('.memory-album-reveal');
            const revImg=rev?.querySelector('.memory-album-print img');
            return {phase:book?.dataset.bookPhase,
              left:{src:l?.getAttribute('src'),width:l?.naturalWidth,complete:l?.complete},
              right:{src:r?.getAttribute('src'),width:r?.naturalWidth,complete:r?.complete},
              reveal:rev?{opacity:getComputedStyle(rev).opacity,width:revImg?.naturalWidth,
                complete:revImg?.complete,visible:getComputedStyle(rev).visibility}:null,
              leaf:!!document.querySelector('.memory-album-leaf')};
          });
          async function run(name,engine,settings,extraArgs=[]){
            const browser=await engine.launch({headless:true,args:extraArgs});
            const context=await browser.newContext({
              viewport:{width:390,height:844},deviceScaleFactor:2,
              isMobile:true,hasTouch:true,serviceWorkers:'block',
              reducedMotion:'no-preference',...settings
            });
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            try {
              const response=await page.goto(base+'/album-preview/?faceqa=10',{waitUntil:'domcontentloaded',timeout:90000});
              await page.locator('.memory-album-book').waitFor({timeout:80000});
              await page.waitForFunction(()=>{
                const imgs=[...document.querySelectorAll('.memory-album-spread > .memory-album-sheet img')];
                return imgs.length===2&&imgs.every(img=>img.complete&&img.naturalWidth>=800);
              },null,{timeout:70000,polling:100});
              const first=await snap(page);
              check(name+' preview loads optimized aspect-preserving book prints',response.status()===200&&
                first.left.width>=800&&first.right.width>=800&&
                first.left.src.endsWith('-book.webp')&&first.right.src.endsWith('-book.webp'),
                {status:response.status(),first});
              await page.evaluate(()=>{
                window.__qaLeftSheet=document.querySelector('.memory-album-spread > .memory-album-sheet--left');
                window.__qaRightSheet=document.querySelector('.memory-album-spread > .memory-album-sheet--right');
                window.__qaLeftImg=window.__qaLeftSheet.querySelector('img');
                window.__qaRightImg=window.__qaRightSheet.querySelector('img');
              });
              const backdrop=await page.evaluate(()=>{
                const el=document.querySelector('.gift-dialog.photo-dialog');
                return el?getComputedStyle(el,'::backdrop').backdropFilter:null;
              });
              check(name+' touch-mode avoids expensive 3D scene backdrop blur',
                !backdrop||backdrop==='none',{backdrop});
              const turns=[];
              for(let i=0;i<6;i++){
                const direction=i%2===0?'next':'previous';
                const before=await snap(page);
                await page.locator('.memory-album-turn--'+direction).click({force:true,timeout:30000});
                await page.waitForFunction(()=>['turning','settling'].includes(
                  document.querySelector('.memory-album-book')?.dataset.bookPhase),null,{timeout:45000});
                const history=await page.evaluate(async()=>{
                  const data=[],start=performance.now();
                  return await new Promise(resolve=>{
                    let sawSettling=false;
                    function frame(){
                      const phase=document.querySelector('.memory-album-book')?.dataset.bookPhase;
                      const sheetL=document.querySelector('.memory-album-spread > .memory-album-sheet--left .memory-album-print img');
                      const sheetR=document.querySelector('.memory-album-spread > .memory-album-sheet--right .memory-album-print img');
                      const overlay=document.querySelector('.memory-album-reveal');
                      const image=overlay?.querySelector('.memory-album-print img');
                      const leaf=document.querySelector('.memory-album-leaf');
                      const front=leaf?.querySelector('.memory-album-leaf-front');
                      const back=leaf?.querySelector('.memory-album-leaf-back');
                      const matrix=leaf?getComputedStyle(leaf).transform:'';
                      const cos=matrix.startsWith('matrix3d(')?Number.parseFloat(matrix.slice(9)):null;
                      const item={phase,elapsed:Math.round(performance.now()-start),
                        l:sheetL?.naturalWidth||0,r:sheetR?.naturalWidth||0,
                        overlay:!!overlay,overlayWidth:image?.naturalWidth||0,
                        overlayOpacity:overlay?Number(getComputedStyle(overlay).opacity):null,
                        overlayVisibility:overlay?getComputedStyle(overlay).visibility:null,
                        leaf:!!leaf,cos,activeFace:leaf?.dataset.activeFace||null,
                        frontVisibility:front?getComputedStyle(front).visibility:null,
                        backVisibility:back?getComputedStyle(back).visibility:null,
                        frontOpacity:front?Number(getComputedStyle(front).opacity):null,
                        backOpacity:back?Number(getComputedStyle(back).opacity):null,
                        frontSrc:front?.querySelector('img')?.getAttribute('src')||null,
                        backSrc:back?.querySelector('img')?.getAttribute('src')||null};
                      if(phase==='settling')sawSettling=true;
                      data.push(item);
                      if((sawSettling&&phase==='ready')||performance.now()-start>9000){
                        resolve(data);return;
                      }
                      requestAnimationFrame(frame);
                    }
                    frame();
                  });
                });
                const after=await snap(page);
                const settled=history.filter(x=>x.phase==='settling');
                const badSettled=settled.filter(x=>!x.overlay||x.overlayWidth<800||
                  x.overlayOpacity<.99||x.overlayVisibility==='hidden'||
                  x.l<800||x.r<800);
                // Independent visibility gating must suppress the old FRONT
                // after 90 degrees. Native WebKit backface culling alone is
                // unreliable on some iPhones.
                const faceFrames=history.filter(x=>x.leaf&&Number.isFinite(x.cos));
                const early=faceFrames.filter(x=>x.cos>.20);
                const late=faceFrames.filter(x=>x.cos<-.20);
                const violations=[
                  ...early.filter(x=>x.activeFace!=='front'||
                    x.frontVisibility!=='visible'||x.backVisibility!=='hidden'||
                    x.backOpacity>0.01),
                  ...late.filter(x=>x.activeFace!=='back'||
                    x.frontVisibility!=='hidden'||x.backVisibility!=='visible'||
                    x.frontOpacity>0.01)
                ];
                const faceSample=faceFrames.at(-1);
                const faceMapping=!!faceSample&&
                  faceSample.frontSrc===(direction==='next'?before.right.src:before.left.src)&&
                  faceSample.backSrc===(direction==='next'?after.left.src:after.right.src);
                const stableNodes=await page.evaluate(()=>({
                  leftSheet:window.__qaLeftSheet===document.querySelector('.memory-album-spread > .memory-album-sheet--left'),
                  rightSheet:window.__qaRightSheet===document.querySelector('.memory-album-spread > .memory-album-sheet--right'),
                  leftImg:window.__qaLeftImg===document.querySelector('.memory-album-spread > .memory-album-sheet--left img'),
                  rightImg:window.__qaRightImg===document.querySelector('.memory-album-spread > .memory-album-sheet--right img')
                }));
                const good=history.at(-1)?.phase==='ready'&&
                  settled.length>=1&&badSettled.length===0&&
                  after.left.width>=800&&after.right.width>=800&&
                  after.left.src!==before.left.src&&
                  after.left.src.endsWith('-book.webp')&&after.right.src.endsWith('-book.webp')&&
                  Object.values(stableNodes).every(Boolean)&&
                  early.length>=1&&late.length>=1&&violations.length===0&&faceMapping;
                turns.push({direction,good,samples:history.length,settlingFrames:settled.length,
                  earlyFaceFrames:early.length,lateFaceFrames:late.length,
                  faceViolations:violations.slice(0,3),faceMapping,
                  faceSample, badSettled:badSettled.slice(0,4),stableNodes,before,after});
                check(name+' '+direction+' turn #'+(i+1)+' never uncovers blank left page',good,
                  turns.at(-1));
              }
              traces.push({name,turns,errors});
              check(name+' no JS errors',errors.length===0,errors.slice(0,8));
            } finally {
              await context.close();
              await browser.close();
            }
          }
          (async()=>{
            const req=await request.newContext();
            const htmlResponse=await req.get(base+'/album-preview/',{timeout:50000});
            const html=await htmlResponse.text();
            check('preview explicitly stages v10 front/back correction',htmlResponse.ok()&&
              html.includes('PhotoGallery-FlipFaces-20261117-v10.js')&&
              html.includes('memory-album-flip-faces-v10.css'),{status:htmlResponse.status()});
            for(const asset of ['PhotoGallery-FlipFaces-20261117-v10.js','memory-album-flip-faces-v10.css']){
              const r=await req.get(base+'/assets/'+asset,{timeout:50000});
              check(asset+' is published',r.ok(),{status:r.status(),bytes:(await r.body()).length});
            }
            for(const route of ['/','/christmas/','/album-preview/']){
              const response=await req.get(base+route,{timeout:50000}),source=await response.text();
              const preview=route==='/album-preview/';
              const js=preview?'PhotoGallery-FlipFaces-20261117-v10.js':'PhotoGallery-MobileOptimized-20261117-v9.js';
              const css=preview?'memory-album-flip-faces-v10.css':'memory-album-mobile-optimized-v9.css';
              check('expected stage v10 WebKit target '+route,response.ok()&&
                source.includes('/assets/'+js)&&
                source.includes('/assets/'+css),
                {status:response.status()});
            }
            await req.dispose();
            await run('macos-webkit-iphone-emulation',webkit,{});
            writeFileSync(out+'/results.json',JSON.stringify({checks,traces,timestamp:new Date().toISOString()},null,2));
            if(checks.some(x=>!x.pass))process.exitCode=1;
          })().then(()=>process.exit(process.exitCode||0))
            .catch(e=>{console.error('MOBILE_ALBUM_QA_FATAL',e);process.exit(1)});
          NODE
          node qa.cjs
      - name: Save paint-handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-mobile-macos-webkit-paint-evidence
          path: album-mobile-qa/
          retention-days: 7
          if-no-files-found: warn
