name: Stage and verify V78 mobile gestures

on:
  push:
    branches: [perf/mobile-gestures-v78]
    paths:
      - '.github/workflows/stage-mobile-v78.yml'
      - 'src/scene/princess-kitten/**'
      - 'src/lib/scene-gestures.ts'
      - 'src/hooks/useSecretInteractions.ts'
      - 'scripts/build-mobile-v78-release.mjs'
      - 'scripts/qa-mobile-performance-v78.cjs'
      - 'scripts/qa-princess-v77.cjs'
      - 'tests/mobile-*.test.mjs'
      - 'tests/character-hit-proxy-v78.test.mjs'
      - 'tests/princess-*.test.mjs'
      - 'tests/gestures.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-mobile-v78
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify runtime, real bones and mobile quality state
        working-directory: source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/princess-kitten*.test.mjs tests/princess-rig*.test.mjs tests/mobile-performance-v78.test.mjs tests/character-hit-proxy-v78.test.mjs tests/gestures.test.mjs
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Preserve baseline and verify the focused release
        env:
          LUMA_PAGES_BASELINE: ${{ github.workspace }}/pages
        run: |
          git -C pages worktree add --detach ../baseline HEAD
          node --test source/tests/mobile-v78-release.test.mjs source/tests/character-hit-proxy-v78.test.mjs
          node source/scripts/build-mobile-v78-release.mjs "$LUMA_PAGES_BASELINE"
          node --input-type=module --check < pages/assets/TreeScene-MobileGestures-V78.js
      - name: Install isolated real browser tests
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/v78-browser"
          npm install --prefix "$RUNNER_TEMP/v78-browser" --no-audit --no-fund --fetch-timeout=45000 --fetch-retries=2 playwright@1.55.1
          browser_path=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'V78_CHROMIUM_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/v78-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Compare mobile gestures and retain all character interactions
        env:
          NODE_PATH: ${{ runner.temp }}/v78-browser/node_modules
          V78_BASE_URL: http://127.0.0.1:4173/
          V78_BASELINE_URL: http://127.0.0.1:4174/
          V78_PERF_OUTPUT: ${{ github.workspace }}/v78-performance-evidence
          V77_BASE_URL: http://127.0.0.1:4173/
          V77_QA_OUTPUT: ${{ github.workspace }}/v78-character-evidence
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory pages > "$RUNNER_TEMP/v78-server.log" 2>&1 &
          candidate_pid=$!
          python -m http.server 4174 --bind 127.0.0.1 --directory baseline > "$RUNNER_TEMP/v77-baseline-server.log" 2>&1 &
          baseline_pid=$!
          trap 'kill "$candidate_pid" "$baseline_pid"' EXIT
          performance_status=0
          character_status=0
          node source/scripts/qa-mobile-performance-v78.cjs || performance_status=$?
          node source/scripts/qa-princess-v77.cjs || character_status=$?
          if [ "$performance_status" -ne 0 ] || [ "$character_status" -ne 0 ]; then
            exit 1
          fi
      - name: Record verified candidate branch
        working-directory: pages
        env:
          CANDIDATE_BRANCH: release/mobile-v78-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html christmas/index.html assets/TreeScene-MobileGestures-V78.js assets/App-MobileGestures-V78.js assets/princess-kitten-v78 v78-release-status.json
          git commit -m 'Optimize mobile touch picking, rendering budget and character updates'
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git rev-parse HEAD > ../v78-performance-evidence/candidate-commit.txt
          printf '%s\n' "$CANDIDATE_BRANCH" > ../v78-performance-evidence/candidate-branch.txt
          printf '%s\n' '${{ github.sha }}' > ../v78-performance-evidence/source-commit.txt
      - name: Save functional and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V78-mobile-performance-evidence
          path: |
            v78-performance-evidence/
            v78-character-evidence/
          retention-days: 14
          if-no-files-found: warn
